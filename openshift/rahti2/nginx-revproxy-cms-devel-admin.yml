apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nginx-revproxy-cms-devel-admin
  annotations:
    description: "Research.fi CMS Nginx reverse proxy for devel admin"
    iconClass: icon-nginx
  labels:
    app: nginx-revproxy-cms-devel-admin
    template: nginx-revproxy-cms-devel-admin
objects:

# Service
- apiVersion: v1
  kind: Service
  metadata:
    name: nginx-revproxy-cms-devel-admin
    labels:
      app: nginx-revproxy-cms-devel-admin
    annotations:
      description: Nginx reverse proxy for CMS admin (devel)
  spec:
    ports:
      - name: nginx
        port: 8080
        targetPort: 8080
    selector:
      app: nginx-revproxy-cms-devel-admin

# Route
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: nginx-revproxy-cms-devel-admin
    labels:
      app: nginx-revproxy-cms-devel-admin
  spec:
    host: cms-django-devel-researchfi.2.rahtiapp.fi
    to:
      kind: Service
      name: nginx-revproxy-cms-devel-admin
      weight: 100
    port:
      targetPort: nginx
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    wildcardPolicy: None

# ImageStream
- apiVersion: image.openshift.io/v1
  kind: ImageStream
  metadata:
    name: nginx-revproxy-cms-devel-admin
    labels:
      app: nginx-revproxy-cms-devel-admin

# BuildConfig using Docker build strategy
- apiVersion: build.openshift.io/v1
  kind: BuildConfig
  metadata:
    name: nginx-revproxy-cms-devel-admin
    labels:
      app: nginx-revproxy-cms-devel-admin
  spec:
    source:
      git:
        uri: https://github.com/CSCfi/research-fi-cms.git
        ref: devel
      contextDir: nginx/devel_admin/rahti2
    strategy:
      type: Docker
      dockerStrategy:
        from:
          kind: ImageStreamTag
          name: nginx-unprivileged:latest
        dockerfilePath: Dockerfile
    output:
      to:
        kind: ImageStreamTag
        name: nginx-revproxy-cms-devel-admin:latest
    successfulBuildsHistoryLimit: 2 
    failedBuildsHistoryLimit: 2

# Deployment config
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: nginx-revproxy-cms-devel-admin
    labels:
      app: nginx-revproxy-cms-devel-admin
  spec:
    selector:
      matchLabels:
        app: nginx-revproxy-cms-devel-admin
    template:
      metadata:
        labels:
          app: nginx-revproxy-cms-devel-admin
      spec:
        containers:
          - name: nginx-revproxy-cms-devel-admin
            image: image-registry.openshift-image-registry.svc:5000/researchfi-devel/nginx-revproxy-cms-devel-admin:latest
            imagePullPolicy: Always
            ports:
              - containerPort: 8080
                protocol: TCP
            resources:
              limits:
                cpu: 250m
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 64Mi
    replicas: 1
    triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
        - nginx-revproxy-cms-devel-admin
        from:
          kind: ImageStreamTag
          name: nginx-revproxy-cms-devel-admin:latest
    strategy:
      type: RollingUpdate